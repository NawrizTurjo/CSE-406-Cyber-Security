name: cse406-b1

services:
  mysql:
    image: cse406-b1-db:2026.1
    pull_policy: never
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 3s
      timeout: 5s
      retries: 30

  app1:
    image: cse406-b1-gym:2026.1
    pull_policy: never
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    depends_on:
      mysql:
        condition: service_healthy

  app2:
    image: cse406-b1-forum:2026.1
    pull_policy: never
    ports:
      - "5001:5001"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    depends_on:
      mysql:
        condition: service_healthy
